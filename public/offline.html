<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#141315">
    <title>Offline · Private Dashboard</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #141315; color: #f5f2f0;
      }
      main { width: min(100%, 420px); padding: 28px; border-radius: 22px; background: #211f22; box-shadow: 0 12px 32px rgba(0,0,0,.36); }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
      p { margin: 12px 0 22px; color: rgba(245,242,240,.6); line-height: 1.55; }
      button { min-height: 44px; border: 0; border-radius: 999px; padding: 11px 20px; background: #7ba888; color: #16211a; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Dashboard-Daten werden aus Sicherheitsgründen nicht offline angezeigt. Sobald du wieder online bist, kannst du die aktuelle Ansicht laden.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
